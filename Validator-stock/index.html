<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi Simulador de Stock</title>
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="js/main.js" defer></script>
  </head>
  <body>
    <div class="contenedor">
      <h1>Mi Simulador de Stock</h1>
      <p id="mensaje-info"></p>
      <div class="formulario">
        <input
          type="text"
          id="input-nombre"
          placeholder="Nombre del producto"
        />
        <input type="number" id="input-precio" placeholder="Precio" />
        <button id="boton-agregar">+ Agregar</button>
      </div>

      <input type="text" id="input-buscador" placeholder="Buscar producto..." />

      <p id="mensaje-feedback"></p>

      <div id="contenedor-items"></div>
      <h2>Productos destacados (API)</h2>
      <p id="mensaje-carga-api"></p>
      <div id="contenedor-destacados"></div>
    </div>
  </body>
</html>
